name: Deploy to VPS

# Nothing runs until a repository admin sets the variable DEPLOY_ENABLED to "true".
# Secrets (names only): VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS
# Variables: DEPLOY_ENABLED, DEPLOY_PATH, DEPLOY_DB, DEPLOY_PHP, VPS_PORT
on:
  push:
    branches: [new]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, gd, intl, mbstring, mysql, redis, zip, pcntl, posix
          tools: composer:v2
          coverage: none
      - name: Install PHP packages from the lock file
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress
      - name: Install the browser driver (Chrome itself is on the server)
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: if [ -f package-lock.json ]; then npm ci --omit=dev --ignore-scripts; else npm install --omit=dev --ignore-scripts --no-audit --no-fund; fi

      - name: Build one release archive
        run: |
          set -euo pipefail
          echo "RELEASE_ID=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          tar --exclude=./.git --exclude=./.github --exclude=./tests --exclude='./.env' --exclude='./.env.*' -czf "$RUNNER_TEMP/release.tar.gz" .
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keygen -y -P '' -f ~/.ssh/deploy > /dev/null 2>&1 || { echo "::error::VPS_SSH_KEY is not a readable private key without a passphrase. Set it again from the key file."; exit 1; }
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_DB: ${{ vars.DEPLOY_DB }}
          DEPLOY_PHP: ${{ vars.DEPLOY_PHP || 'php8.3' }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_DB" =~ ^[A-Za-z0-9_]+$ && "$DEPLOY_PHP" =~ ^[A-Za-z0-9._/-]+$ ]]
          OPTS=(-i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          ssh "${OPTS[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH/incoming' '$DEPLOY_PATH/releases'"
          scp "${OPTS[@]}" -P "$VPS_PORT" "$RUNNER_TEMP/release.tar.gz" "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/incoming/$RELEASE_ID.tar.gz"
          scp "${OPTS[@]}" -P "$VPS_PORT" deploy/release.sh "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/release.sh"
          ssh "${OPTS[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "DEPLOY_PHP='$DEPLOY_PHP' bash '$DEPLOY_PATH/release.sh' deploy '$DEPLOY_PATH' '$RELEASE_ID' '$DEPLOY_DB'" < /dev/null
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy
